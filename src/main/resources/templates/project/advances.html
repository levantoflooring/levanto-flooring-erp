<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{fragments/layout :: head('Advance Payments')}"></head>
<body>
<th:block th:insert="~{fragments/layout :: sidebar('advances-all')}"></th:block>
<div id="main">
  <th:block th:insert="~{fragments/layout :: topbar('Advance Payments')}"></th:block>
  <div class="pb">
    <th:block th:insert="~{fragments/layout :: alerts}"></th:block>
    
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="mb-0" style="font-family:'Cormorant Garamond',serif; font-weight:700;">All Advance Payments</h5>
      <button type="button" class="btn btn-sm btn-gold" data-bs-toggle="modal" data-bs-target="#advanceModal">
        <i class="bi bi-plus-lg me-1"></i>Collect Advance
      </button>
    </div>

    <div class="card card-lv">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-lv mb-0">
            <thead>
              <tr>
                <th>Date</th>
                <th>Receipt #</th>
                <th>Collected From</th>
                <th>Project</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="ap : ${advances}">
                <td th:text="${#temporals.format(ap.paymentDate, 'dd MMM yyyy')}">-</td>
                <td class="fw-bold" th:text="${ap.receiptNumber}">-</td>
                <td th:text="${ap.collectedFrom ?: '—'}">-</td>
                <td>
                  <a th:if="${ap.project != null}" th:href="'/admin/projects/' + ${ap.project.id}" 
                     th:text="${ap.project.name}" style="color:var(--navy-mid); text-decoration:none; font-weight:500;">-</a>
                  <span th:if="${ap.project == null}" class="text-muted small">Not Mapped</span>
                </td>
                <td th:text="'₹' + ${#numbers.formatDecimal(ap.amount, 1, 'COMMA', 2, 'POINT')}">-</td>
                <td>
                  <span class="badge" th:text="${ap.status}"
                        th:classappend="${ap.status.name() == 'RECEIVED' ? 'badge-success' : 'badge-navy'}"></span>
                </td>
                <td>
                  <div class="btn-group btn-group-sm">
                    <a th:href="@{/admin/projects/{pId}/advances/{id}/pdf(pId='0', id=${ap.id})}" 
                       class="btn btn-outline-navy" title="Download Receipt">
                      <i class="bi bi-download"></i>
                    </a>
                    <a th:if="${ap.status.name() == 'RECEIVED'}"
                       th:href="@{/admin/projects/{pId}/advances/{id}/delete(pId='0', id=${ap.id})}" 
                       class="btn btn-outline-danger" title="Delete"
                       onclick="return confirm('Are you sure you want to delete this advance payment? This will also remove the associated payment entry from the ledger.')">
                      <i class="bi bi-trash"></i>
                    </a>
                  </div>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(advances)}">
                <td colspan="7" class="text-center text-muted py-4">No advance payments recorded yet.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Advance Modal -->
<div class="modal fade" id="advanceModal" tabindex="-1">
  <div class="modal-dialog">
    <form th:action="@{/admin/projects/0/advances/save}" method="post" class="modal-content">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <div class="modal-header">
        <h5 class="modal-title">Collect Advance Payment</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body row g-3">
        <div class="col-12">
          <label class="form-label">Collected From</label>
          <input type="text" name="collectedFrom" class="form-control" placeholder="Customer Name / Company">
        </div>
        <div class="col-12">
          <label class="form-label">Amount (₹)</label>
          <input type="number" step="0.01" name="amount" class="form-control" required>
        </div>
        <div class="col-12">
          <label class="form-label">Date</label>
          <input type="date" name="paymentDate" class="form-control" th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required>
        </div>
        <div class="col-12">
          <label class="form-label">Map Project (Optional)</label>
          <select name="project.id" class="form-select">
            <option value="0">-- No Project --</option>
            <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name} + ' (' + ${p.clientName} + ')'"></option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label">Description / Notes</label>
          <textarea name="description" class="form-control" rows="2" placeholder="Advance towards project works..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-navy">Save Advance</button>
      </div>
    </form>
  </div>
</div>

<th:block th:insert="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
